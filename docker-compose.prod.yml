services:
  # =========================================================
  # POSTGRESQL - UNYX ERP (exclusivo, sin puertos públicos)
  # =========================================================
  unyx-postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido}
      TZ: America/Guayaquil
    volumes:
      - unyx_pgdata:/var/lib/postgresql/data
    networks:
      - unyx-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # =========================================================
  # BACKEND - UNYX ERP / Prisma
  # =========================================================
  unyx-backend:
    build:
      context: ./backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@unyx-postgres:5432/${POSTGRES_DB}?schema=public
      DATABASE_URL_ALTOSA: ${DATABASE_URL_ALTOSA:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET requerido}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET requerido}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      CORS_ORIGIN: https://${UNYX_DOMAIN:?UNYX_DOMAIN requerido}
      TRUST_PROXY: "true"
      TZ: America/Guayaquil
      ALTOSA_API_URL: ${ALTOSA_API_URL:?ALTOSA_API_URL requerido}
      ALTOSA_API_KEY: ${ALTOSA_API_KEY:?ALTOSA_API_KEY requerido}
    networks:
      - unyx-internal
    labels:
      traefik.enable: "true"
      # Comillas dobles internas: argumentos válidos para el parser de Traefik.
      traefik.http.routers.unyx-erp-api.rule: 'Host("${UNYX_DOMAIN}") && PathPrefix("/api")'
      traefik.http.routers.unyx-erp-api.entrypoints: websecure
      traefik.http.routers.unyx-erp-api.tls: "true"
      traefik.http.routers.unyx-erp-api.tls.certresolver: letsencrypt
      traefik.http.routers.unyx-erp-api.priority: "20"
      traefik.http.routers.unyx-erp-api.service: unyx-erp-api
      traefik.http.services.unyx-erp-api.loadbalancer.server.port: "4000"
    depends_on:
      unyx-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/v1/health > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =========================================================
  # FRONTEND - UNYX ERP / Next.js
  # =========================================================
  unyx-frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${UNYX_DOMAIN:?UNYX_DOMAIN requerido}
        API_PROXY_URL: http://unyx-backend:4000
    restart: always
    networks:
      - unyx-internal
    labels:
      traefik.enable: "true"
      traefik.http.routers.unyx-erp-web.rule: 'Host("${UNYX_DOMAIN}")'
      traefik.http.routers.unyx-erp-web.entrypoints: websecure
      traefik.http.routers.unyx-erp-web.tls: "true"
      traefik.http.routers.unyx-erp-web.tls.certresolver: letsencrypt
      traefik.http.routers.unyx-erp-web.priority: "10"
      traefik.http.routers.unyx-erp-web.service: unyx-erp-web
      traefik.http.services.unyx-erp-web.loadbalancer.server.port: "3000"
    depends_on:
      unyx-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  unyx-internal:
    driver: bridge

volumes:
  unyx_pgdata:
