services:
  postgres:
    image: postgres:16-alpine
    container_name: unyx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: unyx
      POSTGRES_PASSWORD: unyx_pass
      POSTGRES_DB: unyx_erp
    ports:
      - "5435:5432"
    volumes:
      - unyx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unyx -d unyx_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: unyx-erp-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://unyx:unyx_pass@postgres:5432/unyx_erp?schema=public
      DATABASE_URL_ALTOSA: postgresql://unyx:unyx_pass@postgres:5432/unyx_erp?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-unyx_access_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-unyx_refresh_secret_change_me}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      CORS_ORIGIN: http://localhost:3000
      TRUST_PROXY: "false"
    ports:
      - "4001:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/v1/health > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4001
        API_PROXY_URL: http://backend:4000
    container_name: unyx-erp-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  unyx_pgdata:
